spring.application.name=CustMapApplication

server.port=8080
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.profiles.active= local

app.security.initial-password=123456


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


app.photo.dir=${PHOTO_DIR:./data/photos}
#app.photo.dir=D:/customer-manager/photos
app.photo.max-per-ticket=10

# Google My Maps chứa các điểm KMZ (trang Bản đồ). Dán ID (tham số mid=...) hoặc cả đường link My Maps vào đây.
app.map.my-maps-id=https://www.google.com/maps/d/u/0/edit?mid=1u-qvzQsgedh0WZcuuQUuSDoSkRZZ0pc&ll=12.857261448396384%2C108.28237000000001&z=12

app.export.dir=${EXPORT_DIR:./data/exports}
app.export.ttl-minutes=30
app.export.max-per-user=10