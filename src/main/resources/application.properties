spring.application.name=CustMapApplication

server.port=8080
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ====== Thông tin kết nối DB: đặt qua BIẾN MÔI TRƯỜNG, không ghi cứng vào code ======
# DB_PASSWORD là bắt buộc (không có giá trị mặc định); DB_URL và DB_USERNAME có mặc định cho máy dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_cskh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== Mật khẩu khởi tạo cho tài khoản admin + nhân viên tạo sẵn ======
# Để trống thì app KHÔNG tự tạo tài khoản mặc định. Tài khoản dùng mật khẩu này sẽ bị buộc đổi ở lần đăng nhập đầu.
app.security.initial-password=${APP_INITIAL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
