spring.application.name=CustMapApplication

server.port=8080
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.profiles.active= pro

app.security.initial-password=123456


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# Thư mục lưu ảnh MỚI -> ảnh nằm ở <dir>/<username>/yyyy/MM/dd/uuid.jpg
app.photo.dir=${PHOTO_DIR:/var/data/customer-manager/photo}
#app.photo.dir=D:/customer-manager/photo

# Thư mục lưu ảnh CŨ (nơi ảnh đang nằm trên VPS). Chỉ dùng khi chuyển ảnh
app.photo.old-dir=${PHOTO_OLD_DIR:./data/photos}

# Chuyển ảnh từ old-dir sang dir: bật cho MỘT lần khởi động rồi tắt
app.photo.migrate-old-dir=true

# Xếp ảnh rất cũ (yyyy/MM/dd/...) vào thư mục theo username. Nếu ảnh đã xếp rồi thì có thể tắt
app.photo.migrate-legacy=true

app.photo.max-per-ticket=10

# Google My Maps chứa các điểm KMZ (trang Bản đồ). Dán ID (tham số mid=...) hoặc cả đường link My Maps vào đây.
app.map.my-maps-id=https://www.google.com/maps/d/u/0/edit?mid=1u-qvzQsgedh0WZcuuQUuSDoSkRZZ0pc&ll=12.857261448396384%2C108.28237000000001&z=12

app.export.dir=${EXPORT_DIR:./data/exports}
app.export.ttl-minutes=30
app.export.max-per-user=10

app.security.cookie-secure=true